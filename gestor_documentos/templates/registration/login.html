<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesi&oacute;n</title>
    <style>
        :root {
            --bg: #f3f0ea;
            --panel: #fffdf9;
            --ink: #1f2933;
            --muted: #6b7280;
            --line: #ded6ca;
            --accent: #1d4ed8;
            --accent-strong: #173ea6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(29, 78, 216, 0.10), transparent 35%),
                linear-gradient(135deg, #f6f3ed 0%, #ece6dc 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(100%, 400px);
            background: var(--panel);
            border: 1px solid rgba(222, 214, 202, 0.9);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(31, 41, 51, 0.10);
            padding: 40px 32px 32px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 600;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px;
            font: inherit;
            background: #fff;
        }

        input:focus {
            outline: 2px solid rgba(29, 78, 216, 0.18);
            border-color: var(--accent);
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 14px 18px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
        }

        .errorlist,
        .errornote {
            margin: 0;
            padding: 12px 14px;
            list-style: none;
            border-radius: 14px;
            background: #fdecec;
            color: #9f1d1d;
            font-size: 0.92rem;
        }

        .hint {
            margin-top: 18px;
            font-size: 0.88rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Acceso</h1>
        <p>Ingresa para continuar al gestor documental.</p>

        {% if form.non_field_errors %}
            <div class="errornote">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="{{ form.username.id_for_label }}">Usuario</label>
                {{ form.username }}
            </div>

            <div>
                <label for="{{ form.password.id_for_label }}">Contrase&ntilde;a</label>
                {{ form.password }}
            </div>

            <button type="submit">Iniciar sesi&oacute;n</button>
        </form>

        <div class="hint">Usuario inicial disponible: <strong>sa</strong></div>
    </main>
</body>
</html>
